[project]
name = "score-viewer"
version = "0.1.0"
description = "楽譜PDFビューア + ファイル名から曲名を抽出して ⌘C コピー"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
score-viewer = "score_viewer.app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
